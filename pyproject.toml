[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-edgar-mcp"
version = "0.1.0"
description = "MCP server for SEC EDGAR: screening, financials, insider trades and filing text"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.13",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sec-edgar-mcp = "sec_edgar_mcp.__main__:run"
stock-funnel = "sec_edgar_mcp.funnel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
